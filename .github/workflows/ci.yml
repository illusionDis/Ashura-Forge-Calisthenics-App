name: CI — Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-backend:
    name: Backend Build (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: .NET 8 SDK kur
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Bağımlılıkları yükle
        run: dotnet restore backend/AshuraForge.API.csproj

      - name: Projeyi derle
        run: dotnet build backend/AshuraForge.API.csproj --no-restore -c Release

      - name: Publish al
        run: dotnet publish backend/AshuraForge.API.csproj -c Release -o ./publish --no-build

  build-frontend:
    name: Frontend Build (React + Vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 20 kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları yükle
        run: npm ci
        working-directory: frontend

      - name: Üretim build al
        run: npm run build
        working-directory: frontend
